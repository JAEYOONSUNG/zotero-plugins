							<th data-sort="title"><span data-i18n="thTitle"></span><span class="rz"></span></th>
							<th data-sort="authorString"><span data-i18n="thAuthors"></span><span class="rz"></span></th>
							<th data-sort="affiliation" data-i18n-title="thInstTip"><span data-i18n="thInst"></span><span class="rz"></span></th>
							<th data-sort="year" class="num"><span data-i18n="thYear"></span><span class="rz"></span></th>
							<th data-sort="venue"><span data-i18n="thVenue"></span><span class="rz"></span></th>
							<th data-sort="citations" class="num" data-i18n-title="thCitesTip"><span data-i18n="thCites"></span><span class="rz"></span></th>
							<th data-sort="cpy" class="num" data-i18n-title="thPerYearTip"><span data-i18n="thPerYear"></span><span class="rz"></span></th>
							<th data-sort="journalIF" class="num" data-i18n-title="thIFTip"><span data-i18n="thIF"></span><span class="rz"></span></th>
							<th data-sort="journalOA2y" class="num" data-i18n-title="thOATip"><span data-i18n="thOA"></span><span class="rz"></span></th>
							<th data-sort="pdf" class="mini" data-i18n-title="thPdfTip"><span data-i18n="thPdf"></span><span class="rz"></span></th>
							<th data-sort="inLibrary" class="mini" data-i18n-title="thLibTip"><span data-i18n="thLib"></span><span class="rz"></span></th>
							<th data-sort="status"><span data-i18n="thStatus"></span></th>
							<th data-sort="rank" class="num" data-i18n-title="thRankTip"><span data-i18n="thRank"></span><span class="rz"></span></th>
							<th data-sort="country" class="mini" data-i18n-title="thCountryTip"><span data-i18n="thCountry"></span><span class="rz"></span></th>
							<th data-sort="tier" class="mini" data-i18n-title="thTierTip"><span data-i18n="thTier"></span><span class="rz"></span></th>
							<th data-sort="doi"><span data-i18n="thDoi"></span><span class="rz"></span></th>
						</tr>
					</thead>
					<tbody id="results-body"></tbody>
				</table>
				<div id="empty" class="empty"></div>
				<div id="busy" class="empty" hidden="hidden"><span class="spinner"></span><span id="busy-text"></span></div>
			</div>
			<div id="hsplit" class="splitter-h"></div>
			<div id="detail" class="glass">
				<div id="detail-empty" class="detail-empty" data-i18n="detailEmpty"></div>
				<div id="detail-body" hidden="hidden">
					<div class="detail-head">
						<div id="d-title" class="d-title"></div>
						<div class="d-actions">
							<button id="d-queue" type="button" class="icon-text" aria-pressed="false" hidden="hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-book"/></svg><span id="d-queue-label"></span></button>
							<button id="d-primary" type="button" class="primary icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use id="d-primary-icon" href="#ic-plus"/></svg><span id="d-primary-label"></span></button>
							<button id="d-more" type="button" class="icon-btn" aria-haspopup="menu" aria-expanded="false" data-i18n-title="dMoreTip" data-i18n-aria="dMore"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-more"/></svg></button>
						</div>
					</div>
					<div id="d-pdfview" class="d-preview" hidden="hidden">
						<div class="dp-bar">
							<button id="dp-prev" type="button" class="icon-btn" data-i18n-title="previewPrev" data-i18n-aria="previewPrev">&#8249;</button>
							<span id="dp-page" class="dp-page" role="status" aria-live="polite"></span>
							<button id="dp-next" type="button" class="icon-btn" data-i18n-title="previewNext" data-i18n-aria="previewNext">&#8250;</button>
							<span class="dp-spacer"></span>
							<button id="dp-original" type="button" class="ghost" data-i18n="previewOriginal"></button>
							<button id="dp-close" type="button" class="ghost" data-i18n="previewClose"></button>
						</div>
						<div id="dp-view" class="dp-view">
							<div id="dp-canvas" class="dp-canvas"></div>
							<p id="dp-message" class="dp-message" role="status" aria-live="polite"></p>
							<button id="dp-retry" type="button" data-i18n="previewRetry" hidden="hidden"></button>
						</div>
					</div>
					<div id="d-venue" class="d-venue" hidden="hidden"></div>
					<div id="d-badges" class="badges"></div>
					<div class="d-figure">
						<div id="d-cite" class="d-cite" hidden="hidden"></div>
						<div id="d-evidence" class="d-evidence"></div>
					</div>
					<div id="d-status" class="d-status" hidden="hidden"></div>
					<div id="d-authors" class="d-authors"></div>
					<div id="d-versions" class="d-versions" hidden="hidden"></div>
					<div id="d-signals" class="d-signals" hidden="hidden"></div>
					<div id="d-collections" class="d-collections" hidden="hidden"></div>
					<details id="d-fold" class="d-fold">
						<summary data-i18n="dFold"></summary>
						<div id="d-facets" class="d-facets"></div>
						<div id="d-where" class="d-where"></div>
						<div id="d-meta" class="d-meta"></div>
					</details>
					<div class="d-label" id="d-abs-label" data-i18n="abstractLabel"></div>
					<div id="d-abstract" class="d-abstract"></div>
					<div id="d-tr" class="d-tr">
						<button id="d-tr-run" type="button" class="icon-text" data-i18n-title="trButtonTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-translate"/></svg><span id="d-tr-run-label" data-i18n="trButton"></span></button>
						<button id="d-tr-lang" type="button" class="icon-text" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="trLang"><span id="d-tr-lang-label"></span></button>
						<label class="d-tr-title"><input id="d-tr-title" type="checkbox"/> <span data-i18n="trTitle"></span></label>
						<button id="d-tr-orig" type="button" class="icon-text" aria-expanded="true" hidden="hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use id="d-tr-orig-icon" href="#ic-chevron-up"/></svg><span id="d-tr-orig-label"></span></button>
						<button id="d-tr-copy" type="button" class="icon-text" hidden="hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-copy"/></svg><span data-i18n="trCopy"></span></button>
						<span id="d-tr-note" class="d-tr-note" role="status" aria-live="polite"></span>
					</div>
					<div id="d-tr-out" class="d-tr-out" hidden="hidden">
						<div class="d-tr-head"><span id="d-tr-via" class="d-tr-via"></span></div>
						<div id="d-tr-title-out" class="d-tr-title-out" hidden="hidden"></div>
						<div id="d-tr-text" class="d-tr-text"></div>
					</div>
				</div>
			</div>
		</section>
	</div>

	<div id="import-bar" class="glass">
		<label for="target" class="import-target-label" data-i18n="addTo"></label>
		<select id="target"></select>
		<button id="import-opts-toggle" type="button" class="ghost import-opts-toggle" aria-expanded="false" aria-controls="import-opts"></button>
		<div id="statusbar">
			<span id="status" role="status" aria-live="polite"></span>
			<progress id="progress" max="100" value="0" hidden="hidden"></progress>
		</div>
		<span id="selected-count"></span>
		<button id="selected-only" type="button" aria-pressed="false" hidden="hidden"></button>
		<button id="import-btn" type="button" class="primary icon-text" disabled="disabled"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-plus"/></svg><span data-i18n="importBtn"></span></button>
		<span id="import-opts" class="import-opts" hidden="hidden">
			<label class="cb"><input id="opt-pdf" type="checkbox" checked="checked"/> <span data-i18n="optPdf"></span></label>
			<label class="cb"><input id="opt-skip" type="checkbox" checked="checked"/> <span data-i18n="optSkip"></span></label>
			<label class="cb"><input id="opt-fillpdf" type="checkbox"/> <span data-i18n="optFillPdf"></span></label>
			<label class="cb"><input id="opt-extra" type="checkbox" checked="checked"/> <span data-i18n="optExtra"></span></label>
			<label class="cb" id="opt-queue-wrap" hidden="hidden"><input id="opt-queue" type="checkbox"/> <span data-i18n="optQueue"></span></label>
			<label class="cb" id="opt-trnote-wrap"><input id="opt-trnote" type="checkbox"/> <span data-i18n="optTrNote"></span></label>
		</span>
	</div>

	<div id="filter-pop" class="filter-pop" role="dialog" aria-modal="false" aria-labelledby="filter-pop-title" hidden="hidden"></div>
	<div id="ctxmenu" class="ctxmenu" hidden="hidden"></div>
	<div id="histmenu" class="selmenu histmenu" role="menu" hidden="hidden"></div>
	<div id="tbmenu" class="selmenu tbmenu" role="menu" hidden="hidden"></div>
</div>
</body>
</html>
