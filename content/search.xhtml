<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" windowtype="zotpop:search">
<head>
	<meta charset="utf-8"/>
	<title>ZotPoP</title>
	<link rel="stylesheet" href="chrome://zotpop/content/search.css"/>
	<script src="chrome://zotero/content/include.js"></script>
	<script src="chrome://zotpop/content/i18n.js"></script>
	<script src="chrome://zotpop/content/query.js"></script>
	<script src="chrome://zotpop/content/pop.js"></script>
	<script src="chrome://zotpop/content/brand-icons.js"></script>
	<script src="chrome://zotpop/content/affiliations.js"></script>
	<script src="chrome://zotpop/content/journal-marks.js"></script>
	<script src="chrome://zotpop/content/jcr-2025-data.js"></script>
	<script src="chrome://zotpop/content/jcr.js"></script>
	<script src="chrome://zotpop/content/history.js"></script>
	<script src="chrome://zotpop/content/sources.js"></script>
	<script src="chrome://zotpop/content/metrics.js"></script>
	<script src="chrome://zotpop/content/importer.js"></script>
	<script src="chrome://zotpop/content/preview.js"></script>
	<script src="chrome://zotpop/content/marquee.js"></script>
	<script src="chrome://zotpop/content/ui.js"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
	<symbol id="ic-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></symbol>
	<symbol id="ic-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2"/></symbol>
	<symbol id="ic-clear" viewBox="0 0 16 16"><path d="M3 3.5h10M6.5 3.5V2.5h3v1M4.5 3.5l.7 9a1 1 0 0 0 1 .9h3.6a1 1 0 0 0 1-.9l.7-9"/></symbol>
	<symbol id="ic-all" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.2"/><path d="M5.2 8.2 7.2 10.3l3.6-4"/></symbol>
	<symbol id="ic-none" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.2"/></symbol>
	<symbol id="ic-new" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.2"/><path d="M8 5.4v5.2M5.4 8h5.2"/></symbol>
	<symbol id="ic-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 5.5v-1a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v5A1.5 1.5 0 0 0 4 11h1"/></symbol>
	<symbol id="ic-save" viewBox="0 0 16 16"><path d="M8 2.5v7.5M5 7.2 8 10.2l3-3M2.8 12.5h10.4"/></symbol>
	<symbol id="ic-panel" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.2"/><path d="M2.5 10h11"/></symbol>
	<symbol id="ic-external" viewBox="0 0 16 16"><path d="M9 3h4v4M13 3 7.6 8.4M12 9.5v3A1.5 1.5 0 0 1 10.5 14h-7A1.5 1.5 0 0 1 2 12.5v-7A1.5 1.5 0 0 1 3.5 4h3"/></symbol>
	<symbol id="ic-pdf" viewBox="0 0 16 16"><path d="M4 2.5h5l3 3v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/><path d="M9 2.5v3h3"/><path d="M5.4 11.6V8.9h1a.9.9 0 0 1 0 1.8h-1"/></symbol>
	<symbol id="ic-library" viewBox="0 0 16 16"><path d="M2.5 13.5h11M3.5 13.5V6.2M6.5 13.5V6.2M9.5 13.5V6.2M12.5 13.5V6.2M8 2.2l5.5 3.2h-11z"/></symbol>
	<symbol id="ic-plus" viewBox="0 0 16 16"><path d="M8 3.2v9.6M3.2 8h9.6"/></symbol>
	<symbol id="ic-history" viewBox="0 0 16 16"><path d="M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.6 2.8v3h3M8 5.2V8l2 1.4"/></symbol>
	<symbol id="ic-quote" viewBox="0 0 16 16"><path d="M6.3 4.5C4.6 5.3 3.5 6.8 3.5 8.6c0 1.5 1 2.6 2.3 2.6 1.2 0 2.1-.9 2.1-2.1 0-1.1-.8-2-1.9-2-.2 0-.4 0-.5.1.2-.9.9-1.7 1.9-2.2zM12.6 4.5c-1.7.8-2.8 2.3-2.8 4.1 0 1.5 1 2.6 2.3 2.6 1.2 0 2.1-.9 2.1-2.1 0-1.1-.8-2-1.9-2-.2 0-.4 0-.5.1.2-.9.9-1.7 1.9-2.2z"/></symbol>
</svg>

<div id="app">
	<form id="query-form" class="query glass" onsubmit="return false;">
		<div class="field">
			<label for="source" data-i18n="source"></label>
			<select id="source"></select>
		</div>
		<div class="field grow">
			<label for="authors" data-i18n="authors"></label>
			<input id="authors" type="text" data-i18n-ph="authorsPh"/>
		</div>
		<div class="field grow">
			<label for="venue" data-i18n="venue"></label>
			<input id="venue" type="text" data-i18n-ph="venuePh"/>
		</div>
		<div class="field grow">
			<label for="title" data-i18n="titleWords"></label>
			<input id="title" type="text" data-i18n-ph="titlePh"/>
		</div>
		<div class="field grow2">
			<label for="keywords" data-i18n="keywords"></label>
			<input id="keywords" type="text" data-i18n-ph="keywordsPh"/>
		</div>
		<div class="field years">
			<label data-i18n="years"></label>
			<div class="row">
				<input id="yearFrom" type="number" min="1800" max="2100" data-i18n-ph="yearFromPh"/>
				<span class="dash">–</span>
				<input id="yearTo" type="number" min="1800" max="2100" data-i18n-ph="yearToPh"/>
			</div>
		</div>
		<div class="field">
			<label for="sort" data-i18n="sort"></label>
			<select id="sort">
				<option value="relevance" data-i18n="sortRelevance"></option>
				<option value="citations" data-i18n="sortCitations"></option>
				<option value="date" data-i18n="sortDate"></option>
			</select>
		</div>
		<div class="field narrow">
			<label for="maxResults" data-i18n="maxResults"></label>
			<input id="maxResults" type="number" min="1" max="2000" value="1000"/>
		</div>
		<div class="field buttons">
			<label>&#160;</label>
			<div class="row">
				<button id="search-btn" type="submit" class="primary icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-search"/></svg><span data-i18n="search"></span></button>
				<button id="stop-btn" type="button" class="icon-text" disabled="disabled"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-stop"/></svg><span data-i18n="stop"></span></button>
				<button id="clear-btn" type="button" class="icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-clear"/></svg><span data-i18n="clear"></span></button>
				<button id="history-btn" type="button" class="icon-text" data-i18n-title="historyTip" aria-haspopup="menu" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-history"/></svg><span data-i18n="history"></span></button>
			</div>
		</div>
	</form>

	<div id="banner" class="banner" hidden="hidden"><span id="banner-text"></span><span class="spacer"></span><button id="banner-close" type="button">×</button></div>

	<div id="main">
		<aside id="metrics" class="glass">
			<h3 data-i18n="metricsTitle"></h3>
			<p id="metrics-hint" class="metrics-hint" data-i18n="metricsHint"></p>
			<table id="metrics-table" hidden="hidden">
				<tr><td data-i18n="mYears"></td><td id="m-years">–</td></tr>
				<tr><td data-i18n="mCitationYears"></td><td id="m-cyears">–</td></tr>
				<tr><td data-i18n="mPapers"></td><td id="m-papers">–</td></tr>
				<tr><td data-i18n="mCitations"></td><td id="m-citations">–</td></tr>
				<tr><td data-i18n="mCitesPerYear"></td><td id="m-cpy">–</td></tr>
				<tr><td data-i18n="mCitesPerPaper"></td><td id="m-cpp">–</td></tr>
				<tr><td data-i18n="mCitesPerAuthor"></td><td id="m-cpa">–</td></tr>
				<tr><td data-i18n="mPapersPerAuthor"></td><td id="m-ppa">–</td></tr>
				<tr><td data-i18n="mAuthorsPerPaper"></td><td id="m-app">–</td></tr>
				<tr class="hl"><td>h-index</td><td id="m-h">–</td></tr>
				<tr class="hl"><td>g-index</td><td id="m-g">–</td></tr>
				<tr><td>hI,norm</td><td id="m-hinorm">–</td></tr>
				<tr><td>hI,annual</td><td id="m-hiannual">–</td></tr>
				<tr><td>hA-index</td><td id="m-ha">–</td></tr>
			</table>
			<p class="hint" data-i18n="metricsHint"></p>
		</aside>

		<div id="vsplit" class="splitter-v"></div>

		<section id="results">
			<div class="toolbar glass">
				<span class="searchbox">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic muted"><use href="#ic-search"/></svg>
					<input id="filter" type="search" data-i18n-ph="filterPh"/>
					<button id="filter-clear" type="button" class="filter-clear" data-i18n-title="filterClear" aria-label="clear" hidden="hidden">×</button>
				</span>
				<span class="spacer"></span>
				<button id="preview-btn" type="button" class="icon-text preview-action" data-i18n-title="previewTip" disabled="disabled"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-pdf"/></svg><span data-i18n="previewAction"></span></button>
				<button id="select-all" type="button" data-i18n-title="selAll" class="ghost icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-all"/></svg><span data-i18n="selAll"></span></button>
				<button id="select-none" type="button" data-i18n-title="selNone" class="ghost icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-none"/></svg><span data-i18n="selNone"></span></button>
				<button id="select-new" type="button" class="ghost icon-text" data-i18n-title="selNewTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-new"/></svg><span data-i18n="selNew"></span></button>
				<span class="sep"></span>
				<button id="copy-csv" type="button" class="ghost icon-text" data-i18n-title="copyCsvTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-copy"/></svg><span data-i18n="copyCsv"></span></button>
				<button id="save-csv" type="button" class="ghost icon-text" data-i18n-title="saveCsvTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-save"/></svg><span data-i18n="saveCsv"></span></button>
				<button id="toggle-metrics" type="button" class="ghost icon-text" data-i18n-title="metricsTip" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-panel"/></svg><span data-i18n="metricsToggle"></span></button>
				<button id="toggle-detail" type="button" class="ghost icon-text" data-i18n-title="detailTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-panel"/></svg><span id="toggle-detail-label"></span></button>
			</div>
			<div class="table-wrap" id="table-wrap" tabindex="0">
				<table id="results-table">
					<colgroup id="cols">
						<col data-k="chk"/><col data-k="citations"/><col data-k="cpy"/><col data-k="rank"/>
						<col data-k="authorString"/><col data-k="title"/><col data-k="year"/><col data-k="venue"/><col data-k="journalIF"/>
							<col data-k="affiliation"/><col data-k="country"/><col data-k="tier"/>
						<col data-k="doi"/><col data-k="pdf"/><col data-k="inLibrary"/><col data-k="status"/>
					</colgroup>
					<thead>
						<tr>
							<th class="chk"><input id="chk-all" type="checkbox" data-i18n-title="chkAllTip"/></th>
							<th data-sort="citations" class="num"><span data-i18n="thCites"></span><span class="rz"></span></th>
							<th data-sort="cpy" class="num"><span data-i18n="thPerYear"></span><span class="rz"></span></th>
							<th data-sort="rank" class="num"><span data-i18n="thRank"></span><span class="rz"></span></th>
							<th data-sort="authorString"><span data-i18n="thAuthors"></span><span class="rz"></span></th>
							<th data-sort="title"><span data-i18n="thTitle"></span><span class="rz"></span></th>
							<th data-sort="year" class="num"><span data-i18n="thYear"></span><span class="rz"></span></th>
							<th data-sort="venue"><span data-i18n="thVenue"></span><span class="rz"></span></th>
							<th data-sort="journalIF" class="num" data-i18n-title="thIFTip"><span data-i18n="thIF"></span><span class="rz"></span></th>
							<th data-sort="affiliation" data-i18n-title="thInstTip"><span data-i18n="thInst"></span><span class="rz"></span></th>
							<th data-sort="country" class="mini" data-i18n-title="thCountryTip"><span data-i18n="thCountry"></span><span class="rz"></span></th>
							<th data-sort="tier" class="mini" data-i18n-title="thTierTip"><span data-i18n="thTier"></span><span class="rz"></span></th>
							<th data-sort="doi"><span data-i18n="thDoi"></span><span class="rz"></span></th>
							<th data-sort="pdf" class="mini" data-i18n-title="thPdfTip"><span data-i18n="thPdf"></span><span class="rz"></span></th>
							<th data-sort="inLibrary" class="mini" data-i18n-title="thLibTip"><span data-i18n="thLib"></span><span class="rz"></span></th>
							<th data-sort="status"><span data-i18n="thStatus"></span></th>
						</tr>
					</thead>
					<tbody id="results-body"></tbody>
				</table>
				<div id="empty" class="empty"></div>
				<div id="busy" class="empty" hidden="hidden"><span class="spinner"></span><span id="busy-text"></span></div>
			</div>
			<div id="hsplit" class="splitter-h"></div>
			<div id="detail" class="glass">
				<div id="detail-empty" class="detail-empty" data-i18n="detailEmpty"></div>
				<div id="detail-body" hidden="hidden">
					<div class="detail-head">
						<div id="d-title" class="d-title"></div>
						<div id="d-badges" class="badges"></div>
					</div>
					<div id="d-authors" class="d-authors"></div>
						<div id="d-where" class="d-where"></div>
					<div id="d-meta" class="d-meta"></div>
					<div class="d-actions">
						<button id="d-open" type="button" data-i18n-title="dOpen" class="icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-external"/></svg><span data-i18n="dOpen"></span></button>
						<button id="d-pdf" type="button" data-i18n-title="dPdf" class="icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-pdf"/></svg><span data-i18n="dPdf"></span></button>
						<button id="d-preview" type="button" class="icon-text preview-action" data-i18n-title="previewTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-pdf"/></svg><span data-i18n="previewAction"></span></button>
						<button id="d-proxy" type="button" class="icon-text" data-i18n-title="dProxyTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-library"/></svg><span data-i18n="dProxy"></span></button>
						<button id="d-copy-doi" type="button" data-i18n-title="dCopyDoi" class="icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-copy"/></svg><span data-i18n="dCopyDoi"></span></button>
						<button id="d-copy-cite" type="button" data-i18n-title="dCopyCite" class="icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-quote"/></svg><span data-i18n="dCopyCite"></span></button>
						<button id="d-check" type="button" class="icon-text" data-i18n-title="dCheckTip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-search"/></svg><span data-i18n="dCheck"></span></button>
						<button id="d-add" type="button" data-i18n-title="dAdd" class="primary icon-text"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-plus"/></svg><span data-i18n="dAdd"></span></button>
					</div>
					<div id="d-abstract" class="d-abstract"></div>
				</div>
			</div>
		</section>
	</div>

	<div id="import-bar" class="glass">
		<label for="target" data-i18n="addTo"></label>
		<select id="target"></select>
		<label class="cb"><input id="opt-pdf" type="checkbox" checked="checked"/> <span data-i18n="optPdf"></span></label>
		<label class="cb"><input id="opt-skip" type="checkbox" checked="checked"/> <span data-i18n="optSkip"></span></label>
		<label class="cb"><input id="opt-extra" type="checkbox" checked="checked"/> <span data-i18n="optExtra"></span></label>
		<span class="spacer"></span>
		<span id="selected-count"></span>
		<button id="import-btn" type="button" class="primary icon-text" disabled="disabled"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="ic"><use href="#ic-plus"/></svg><span data-i18n="importBtn"></span></button>
	</div>

	<div id="statusbar">
		<span id="status" role="status" aria-live="polite"></span>
		<span class="spacer"></span>
		<progress id="progress" max="100" value="0" hidden="hidden"></progress>
	</div>

	<div id="ctxmenu" class="ctxmenu" hidden="hidden"></div>
	<div id="histmenu" class="selmenu histmenu" role="menu" hidden="hidden"></div>
</div>
</body>
</html>
