<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml"
      onload="Zotero.ZotPoP.localizePrefs(document);">
	<groupbox>
		<label><html:h2 data-i18n="prefTitle"></html:h2></label>
		<html:p data-i18n="prefOpenHint"></html:p>
		<hbox align="center">
			<label data-i18n-value="prefLanguage" control="zotpop-language"/>
			<menulist id="zotpop-language" preference="extensions.zotpop.language" native="true">
				<menupopup>
					<menuitem value="auto" data-i18n-label="prefLangAuto"/>
					<menuitem value="en" data-i18n-label="prefLangEn"/>
					<menuitem value="ko" data-i18n-label="prefLangKo"/>
				</menupopup>
			</menulist>
			<label style="color: gray" data-i18n-value="prefLangNote"/>
		</hbox>
		<hbox align="center">
			<label data-i18n-value="prefEmail" control="zotpop-email"/>
			<html:input id="zotpop-email" type="email" preference="extensions.zotpop.email" style="width: 240px"/>
		</hbox>
		<hbox align="center">
			<label data-i18n-value="prefOpenAlexKey" control="zotpop-openalex"/>
			<html:input id="zotpop-openalex" type="text" preference="extensions.zotpop.openAlexApiKey" style="width: 240px"/>
		</hbox>
		<html:p style="color: gray" data-i18n="prefOpenAlexNote"></html:p>
		<hbox align="center">
			<label data-i18n-value="prefS2" control="zotpop-s2"/>
			<html:input id="zotpop-s2" type="text" preference="extensions.zotpop.s2ApiKey" style="width: 240px"/>
		</hbox>
		<hbox align="center">
			<label data-i18n-value="prefPoP" control="zotpop-pop"/>
			<html:input id="zotpop-pop" type="text" preference="extensions.zotpop.popExecutable" style="width: 320px"/>
		</hbox>
		<html:p style="color: gray" data-i18n="prefPoPNote"></html:p>
		<hbox align="center">
			<label data-i18n-value="prefMax" control="zotpop-max"/>
			<html:input id="zotpop-max" type="number" min="1" max="2000" preference="extensions.zotpop.maxResults" style="width: 80px"/>
		</hbox>
		<checkbox id="zotpop-enrich" data-i18n-label="prefEnrich" preference="extensions.zotpop.enrichCitations"/>
		<checkbox id="zotpop-jif" data-i18n-label="prefJIF" preference="extensions.zotpop.journalMetrics"/>
		<checkbox id="zotpop-inst" data-i18n-label="prefInstitutions" preference="extensions.zotpop.institutionMetrics"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-i18n="prefProxyTitle"></html:h2></label>
		<html:p data-i18n="prefProxyIntro"></html:p>
		<hbox align="center">
			<label data-i18n-value="prefProxyLabel" control="zotpop-proxy"/>
			<html:input id="zotpop-proxy" type="text" preference="extensions.zotpop.proxyPrefix"
				placeholder="https://access.yonsei.ac.kr/link.n2s?url=" style="width: 320px"/>
			<button id="zotpop-proxy-preset" data-i18n-label="prefProxyPreset"
				oncommand="Zotero.ZotPoP.setProxyPrefix(document, 'https://access.yonsei.ac.kr/link.n2s?url=');"/>
			<button id="zotpop-proxy-clear" data-i18n-label="prefProxyClear"
				oncommand="Zotero.ZotPoP.setProxyPrefix(document, '');"/>
		</hbox>
		<hbox align="center">
			<button id="zotpop-proxy-login" data-i18n-label="loginOpen" oncommand="Zotero.ZotPoP.openProxyLogin();"/>
		</hbox>
		<html:p style="color: gray" data-i18n="prefProxyNote1"></html:p>
		<html:p style="color: gray" data-i18n="prefProxyNote2"></html:p>
	</groupbox>

	<groupbox>
		<label><html:h2 data-i18n="prefNotesTitle"></html:h2></label>
		<html:p style="color: gray" data-i18n="prefNoteScholar"></html:p>
		<html:p style="color: gray" data-i18n="prefNoteFeed"></html:p>
		<html:p style="color: gray" data-i18n="prefNoteIF"></html:p>
	</groupbox>
</vbox>
