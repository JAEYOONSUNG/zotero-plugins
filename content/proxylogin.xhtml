<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" windowtype="zotpop:proxylogin">
<head>
	<meta charset="utf-8"/>
	<title>ZotPoP</title>
	<link rel="stylesheet" href="chrome://zotpop/content/search.css"/>
	<script src="chrome://zotero/content/include.js"></script>
	<script src="chrome://zotpop/content/i18n.js"></script>
	<script src="chrome://zotpop/content/proxylogin.js"></script>
</head>
<body>
<div id="app">
	<div class="toolbar glass" id="pl-bar">
		<button id="pl-back" type="button" class="ghost">◀</button>
		<button id="pl-reload" type="button" class="ghost">⟳</button>
		<span id="pl-url" class="pl-url"></span>
		<span class="spacer"></span>
		<button id="pl-check" type="button" class="primary"></button>
		<button id="pl-close" type="button"></button>
	</div>
	<p id="pl-intro" class="pl-intro"></p>
	<div id="pl-browser-host"></div>
	<div id="statusbar"><span id="pl-status"></span></div>
</div>
</body>
</html>
